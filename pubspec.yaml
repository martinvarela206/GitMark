name: gitmark
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_markdown: ^0.7.7+1  # Widget para mostrar el markdown con estilos.
  http: ^1.2.2                # Cliente HTTP para API REST de GitHub.
  sqflite: ^2.4.1             # Para uso de SQLite en el móvil.
  path: ^1.9.0                # Manejador de rutas de almacenamiento interno.

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/
